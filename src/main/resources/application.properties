spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.datasource.url=jdbc:postgresql://${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.data.rest.detection-strategy=annotated

oauth.google-client-id=${GOOGLE_CLIENT_ID}
oauth.google-client-secret=${GOOGLE_CLIENT_SECRET}
oauth.redirect-url=${REDIRECT_URL}
oauth.client-url=${CLIENT_URL}
oauth.token-secret=${TOKEN_SECRET}

ai.service.base-url=${AI_SERVICE_BASE_URL}
ai.service.api-key=${AI_SERVICE_API_KEY}
ai.service.meal-plan-generation-endpoint=${AI_SERVICE_MEAL_PLAN_ENDPOINT:/generate-meal-plan}
ai.service.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:30}

spring.data.redis.host=${REDIS_URL}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.database=${REDIS_DB_INDEX}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SECURE_COOKIE}
server.servlet.session.cookie.max-age=7d
server.servlet.session.timeout=7d

server.error.include-message=always
server.servlet.context-path=/api
server.address=0.0.0.0

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.com.harding.meals=DEBUG

logging.level.com.google.api.client.http = DEBUG

